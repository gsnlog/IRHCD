<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Horizontal Curve Engineering Tool</title>

<style>

body{
font-family:Segoe UI;
margin:0;
background:#eef2f7;
}

header{
background:#1e3a5f;
color:white;
padding:14px;
font-size:20px;
}

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:20px;
}

.card{
background:white;
padding:16px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

h3{
margin-top:0;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:8px;
}

input{
padding:6px;
width:120px;
}

input[readonly]{
background:#f0f3f8;
}

table{
width:100%;
border-collapse:collapse;
font-size:13px;
}

td,th{
border:1px solid #ccc;
padding:4px;
text-align:center;
}

.error{
color:red;
font-size:13px;
}

</style>

</head>


<body>

<header>
Railway Horizontal Curve Engineering App
</header>

<div class="container">

<!-- GEOMETRY -->

<div class="card">

<h3>Curve Geometry</h3>

<div class="row">
<label>Radius (m)</label>
<input id="radius">
</div>

<div class="row">
<label>Speed (km/h)</label>
<input id="speed">
</div>

<div class="row">
<label>Cant (mm)</label>
<input id="cant">
</div>

<div class="row">
<label>Cant Deficiency</label>
<input id="cd">
</div>

</div>


<!-- TRANSITION DESIGN -->

<div class="card">

<h3>Transition Curve Designer</h3>

<div class="row">
<label>Transition Length</label>
<input id="transition" readonly>
</div>

<div class="row">
<label>Shift</label>
<input id="shift" readonly>
</div>

<button onclick="transitionDesign()">Design</button>

</div>


<!-- COMPOUND CURVE -->

<div class="card">

<h3>Compound Curve</h3>

<div class="row">
<label>Cant Curve1</label>
<input id="ca1">
</div>

<div class="row">
<label>Cant Curve2</label>
<input id="ca2">
</div>

<div class="row">
<label>Speed</label>
<input id="vm">
</div>

<div class="row">
<label>Transition Length</label>
<input id="compound_L" readonly>
</div>

<button onclick="compoundCurve()">Calculate</button>

</div>


<!-- REVERSE CURVE -->

<div class="card">

<h3>Reverse Curve</h3>

<div class="row">
<label>Cant1</label>
<input id="rc1">
</div>

<div class="row">
<label>Cant2</label>
<input id="rc2">
</div>

<div class="row">
<label>Speed</label>
<input id="rvm">
</div>

<div class="row">
<label>Transition</label>
<input id="reverse_L" readonly>
</div>

<button onclick="reverseCurve()">Calculate</button>

</div>


<!-- VERSINE TABLE -->

<div class="card">

<h3>Versine Station Table</h3>

<button onclick="versineTable()">Generate</button>

<div id="versineTable"></div>

</div>


<!-- TRANSITION OFFSETS -->

<div class="card">

<h3>Transition Setting-Out</h3>

<div class="row">
<label>Transition</label>
<input id="tL">
</div>

<div class="row">
<label>Radius</label>
<input id="tR">
</div>

<button onclick="transitionOffsets()">Generate</button>

<div id="offsetTable"></div>

</div>


<!-- CANT DISTRIBUTION -->

<div class="card">

<h3>Cant Distribution Table</h3>

<button onclick="cantDistribution()">Generate</button>

<div id="cantTable"></div>

</div>


<!-- TURNOUT ON CURVE -->

<div class="card">

<h3>Turnout on Curve</h3>

<div class="row">
<label>Main Radius</label>
<input id="mr">
</div>

<div class="row">
<label>Turnout Radius</label>
<input id="tr">
</div>

<div class="row">
<label>Resultant Radius</label>
<input id="resRadius" readonly>
</div>

<button onclick="turnoutCalc()">Calculate</button>

</div>


<!-- SPEED CHECK -->

<div class="card">

<h3>Speed Restriction Checker</h3>

<div class="row">
<label>Calculated Speed</label>
<input id="speedCheck" readonly>
</div>

<div id="speedWarn" class="error"></div>

<button onclick="speedCheck()">Check</button>

</div>


<!-- IRPWM VALIDATION -->

<div class="card">

<h3>IRPWM Compliance</h3>

<div id="irpwm"></div>

<button onclick="validateIRPWM()">Validate</button>

</div>


</div>



<script>


function transitionDesign(){

let R=parseFloat(radius.value)
let Ca=parseFloat(cant.value)
let Cd=parseFloat(cd.value)
let Vm=parseFloat(speed.value)

let L1=0.0056*Ca*Vm
let L2=0.0056*Cd*Vm
let L3=0.72*Ca

let L=Math.max(L1,L2,L3)

transition.value=L.toFixed(2)

let S=(L*L)/(24*R)

shift.value=S.toFixed(3)

}



function compoundCurve(){

let L=0.0056*(ca1.value-ca2.value)*vm.value

compound_L.value=Math.abs(L).toFixed(2)

}



function reverseCurve(){

let L=0.0056*(parseFloat(rc1.value)+parseFloat(rc2.value))*parseFloat(rvm.value)

reverse_L.value=L.toFixed(2)

}



function versineTable(){

let R=parseFloat(radius.value)

let html="<table><tr><th>Station</th><th>Versine mm</th></tr>"

for(let i=10;i<=200;i+=10){

let v=(1000*(20*20))/(8*R)

html+="<tr><td>"+i+"</td><td>"+v.toFixed(2)+"</td></tr>"

}

html+="</table>"

versineTable.innerHTML=html

}



function transitionOffsets(){

let L=parseFloat(tL.value)
let R=parseFloat(tR.value)

let html="<table><tr><th>X</th><th>Offset</th></tr>"

for(let x=5;x<=L;x+=5){

let y=(x*x*x)/(6*R*L)

html+="<tr><td>"+x+"</td><td>"+y.toFixed(3)+"</td></tr>"

}

html+="</table>"

offsetTable.innerHTML=html

}



function cantDistribution(){

let html="<table><tr><th>Station</th><th>Cant</th></tr>"

let L=parseFloat(transition.value)
let C=parseFloat(cant.value)

for(let i=0;i<=L;i+=5){

let val=(C/L)*i

html+="<tr><td>"+i+"</td><td>"+val.toFixed(2)+"</td></tr>"

}

html+="</table>"

cantTable.innerHTML=html

}



function turnoutCalc(){

let r=(mr.value*tr.value)/(parseFloat(mr.value)+parseFloat(tr.value))

resRadius.value=r.toFixed(2)

}



function speedCheck(){

let R=parseFloat(radius.value)
let C=parseFloat(cant.value)

let sp=Math.sqrt((C+100)*R*0.27)

speedCheck.value=sp.toFixed(2)

if(sp>130)

speedWarn.innerHTML="Speed exceeds 130 km/h"

else

speedWarn.innerHTML="Speed OK"

}



function validateIRPWM(){

let txt=""

if(cant.value>185)

txt+="Cant exceeds IRPWM limit<br>"

if(cd.value>100)

txt+="Cant deficiency above standard<br>"

irpwm.innerHTML=txt

}

</script>

</body>
</html>
