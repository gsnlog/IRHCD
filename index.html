<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Horizontal Curve Designer</title>

<style>

body{
font-family:Segoe UI,Arial;
background:#f3f5f9;
margin:0;
}

header{
background:#1f3a60;
color:white;
padding:14px 20px;
font-size:20px;
}

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card{
background:white;
padding:18px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h3{
margin-top:0;
color:#1f3a60;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:8px;
gap:10px;
}

input,select{
padding:6px;
width:120px;
}

input[readonly]{
background:#eef1f6;
}

.error{
color:#d63031;
font-size:13px;
}

.warning{
color:#e67e22;
font-size:13px;
}

.steps{
font-family:Consolas;
font-size:13px;
background:#fafafa;
padding:10px;
border-radius:6px;
white-space:pre-line;
}

</style>

</head>


<body>

<header>
Railway Horizontal Curve Designer
</header>

<div class="container">

<!-- INPUTS -->

<div class="card">

<h3>Track Parameters</h3>

<div class="row">
<label>Gauge</label>

<select id="gauge">
<option value="1750">BG</option>
<option value="1000">MG</option>
<option value="762">NG</option>
</select>
</div>

<div class="row">
<label>Route Group</label>

<select id="group">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>
</select>
</div>

</div>



<div class="card">

<h3>Curve Geometry</h3>

<div class="row">
<label>Radius (m)</label>
<input id="radius">
</div>

<div class="row">
<label>Degree</label>
<input id="degree">
</div>

<div class="row">
<label>Chord (m)</label>
<input id="chord" value="20">
</div>

<div class="row">
<label>Versine (mm)</label>
<input id="versine">
</div>

<div id="geometry_error" class="error"></div>

</div>



<div class="card">

<h3>Speed</h3>

<div class="row">
<label>Vmax km/h</label>
<input id="vmax">
</div>

<div class="row">
<label>Vmin km/h</label>
<input id="vmin">
</div>

</div>



<div class="card">

<h3>Cant Results</h3>

<div class="row">
<label>Eq Cant Vmax</label>
<input id="cant_vmax" readonly>
</div>

<div class="row">
<label>Eq Cant Vmin</label>
<input id="cant_vmin" readonly>
</div>

<div class="row">
<label>Max Cant</label>
<input id="cant_max" readonly>
</div>

<div class="row">
<label>Cant Provided</label>
<input id="cant_provided">
</div>

<div class="row">
<label>Cant Deficiency</label>
<input id="cant_def" readonly>
</div>

<div id="cant_warning" class="warning"></div>

</div>



<div class="card">

<h3>Speed Result</h3>

<div class="row">
<label>Maximum Speed</label>
<input id="speed" readonly>
</div>

</div>



<div class="card">

<h3>Calculation Steps</h3>

<div class="steps" id="steps"></div>

</div>


</div>



<script>


const fields=["radius","degree","versine","vmax","vmin","cant_provided"]

fields.forEach(id=>{

document.getElementById(id).addEventListener("input",calculate)

})


function calculate(){

let R=parseFloat(radius.value)
let V=parseFloat(versine.value)
let C=parseFloat(chord.value)
let vmax_val=parseFloat(vmax.value)
let vmin_val=parseFloat(vmin.value)
let gauge=parseFloat(gauge_select())
let group=document.getElementById("group").value

let step_text=""

geometry_error.innerHTML=""
cant_warning.innerHTML=""



if(!R && V){

R=(125*C*C)/V
radius.value=R.toFixed(2)

step_text+=`
Radius from versine

R = 125 C² / V
R = 125 × ${C}² / ${V}

R = ${R.toFixed(2)} m
`
}



if(R && !V){

V=(125*C*C)/R
versine.value=V.toFixed(2)

step_text+=`
Versine from radius

V = 125 C² / R

V = ${V.toFixed(2)} mm
`
}



if(R){

let D=1750/R
degree.value=D.toFixed(3)

step_text+=`

Degree of curve

D = 1750 / R

D = ${D.toFixed(3)}°
`

}



if(R && vmax_val){

let cant1=(vmax_val*vmax_val*gauge)/(127*R)

cant_vmax.value=cant1.toFixed(2)

step_text+=`

Cant for Vmax

C = V²G / 127R

C = (${vmax_val}² × ${gauge}) / (127 × ${R})

C = ${cant1.toFixed(2)} mm
`

}



if(R && vmin_val){

let cant2=(vmin_val*vmin_val*gauge)/(127*R)

cant_vmin.value=cant2.toFixed(2)

}



let maxcant=(group=="A"||group=="B")?185:165

cant_max.value=maxcant



let provided=parseFloat(cant_provided.value)

if(provided){

let deficiency=(cant_vmax.value-provided)

cant_def.value=deficiency.toFixed(2)

if(deficiency>100){

cant_warning.innerHTML="Cant deficiency exceeds 100 mm"

}

}



if(R && provided){

let speed_calc=Math.sqrt((provided+100)*R*0.27)

speed.value=speed_calc.toFixed(2)

}



steps.innerText=step_text

}



function gauge_select(){

return document.getElementById("gauge").value

}

</script>


</body>
</html>
