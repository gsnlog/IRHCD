<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Horizontal Curve Designer</title>

<style>

body{
font-family:Segoe UI;
background:#e6e6e6;
margin:0;
}

.container{
padding:20px;
max-width:1000px;
margin:auto;
background:white;
}

h2{
margin-top:0;
}

.row{
display:flex;
align-items:center;
margin-bottom:10px;
}

label{
width:260px;
}

input,select{
padding:5px;
width:120px;
margin-right:10px;
}

button{
padding:6px 14px;
background:#2e7dd1;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#1c5fa8;
}

canvas{
border:1px solid #ccc;
margin-top:20px;
}

</style>

</head>


<body>

<div class="container">

<h2>Horizontal Curve Designer</h2>


<div class="row">
<label>Gauge</label>
<select id="gauge">
<option value="1750">BG</option>
<option value="1000">MG</option>
<option value="762">NG</option>
</select>

<label>Route Group</label>

<select id="group">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>
</select>

</div>


<div class="row">

<label>Radius of Curve</label>
<input id="radius">

<label>Degree of Curve</label>
<input id="degree">

</div>



<div class="row">

<label>Chord Length</label>
<input id="chord" value="20">

<label>Versine</label>
<input id="versine">

</div>



<div class="row">

<label>Maximum Speed (Vmax)</label>
<input id="vmax">

<label>Minimum Speed (Vmin)</label>
<input id="vmin">

</div>



<div class="row">

<label>Equilibrium Cant for Vmax</label>
<input id="cant_vmax">

</div>


<div class="row">

<label>Equilibrium Cant for Vmin</label>
<input id="cant_vmin">

</div>


<div class="row">

<label>Max Cant Allowable</label>
<input id="cant_max">

<label>Min Cant Allowable</label>
<input id="cant_min">

</div>



<div class="row">

<label>Cant Provided</label>

<input type="range" min="0" max="185" id="cant_provided">

<span id="cant_val"></span>

</div>


<div class="row">

<label>Maximum Safe Speed</label>

<input id="speed">

</div>



<div class="row">

<button onclick="design()">Design</button>

<button onclick="clearInputs()">Clear Inputs</button>

<button onclick="print()">Print</button>

</div>


<canvas id="cantChart" width="800" height="250"></canvas>

</div>



<script>

document.getElementById("cant_provided").oninput=function(){

document.getElementById("cant_val").innerHTML=this.value+" mm"

}


function design(){

R=parseFloat(document.getElementById("radius").value)

Vmax=parseFloat(document.getElementById("vmax").value)

Vmin=parseFloat(document.getElementById("vmin").value)

G=parseFloat(document.getElementById("gauge").value)

cant1=(Vmax*Vmax*G)/(127*R)

cant2=(Vmin*Vmin*G)/(127*R)

document.getElementById("cant_vmax").value=cant1.toFixed(2)

document.getElementById("cant_vmin").value=cant2.toFixed(2)



if(document.getElementById("group").value=="A" || document.getElementById("group").value=="B")

maxcant=185

else

maxcant=165

document.getElementById("cant_max").value=maxcant

document.getElementById("cant_min").value=0



cd=100

speed=Math.sqrt((cd+cant1)*R*0.27)

document.getElementById("speed").value=speed.toFixed(2)



drawCant()

}



function clearInputs(){

inputs=document.querySelectorAll("input")

inputs.forEach(i=>i.value="")

}



function drawCant(){

canvas=document.getElementById("cantChart")

ctx=canvas.getContext("2d")

ctx.clearRect(0,0,800,250)

ctx.beginPath()

ctx.moveTo(50,200)

ctx.lineTo(300,50)

ctx.lineTo(550,50)

ctx.lineTo(750,200)

ctx.stroke()

}


</script>


</body>

</html>
