<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Horizontal Curve Designer</title>

<style>

body{
font-family:Segoe UI,Arial;
margin:0;
background:#eef2f7;
}

header{
background:#1e3a5f;
color:white;
padding:15px;
font-size:20px;
}

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:20px;
}

.card{
background:white;
padding:18px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

h3{
margin-top:0;
color:#1e3a5f;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:10px;
gap:10px;
}

input,select{
padding:6px;
width:130px;
}

input[readonly]{
background:#f0f3f8;
}

.error{
color:#d63031;
font-size:13px;
}

.warning{
color:#e67e22;
font-size:13px;
}

.steps{
background:#fafafa;
padding:10px;
border-radius:6px;
font-family:Consolas;
font-size:13px;
white-space:pre-line;
}

canvas{
width:100%;
height:220px;
border:1px solid #ccc;
border-radius:6px;
}

</style>

</head>

<body>

<header>
Railway Horizontal Curve Designer
</header>

<div class="container">

<!-- PARAMETERS -->

<div class="card">

<h3>Track Parameters</h3>

<div class="row">
<label>Gauge</label>
<select id="gauge">
<option value="1750">BG</option>
<option value="1000">MG</option>
<option value="762">NG</option>
</select>
</div>

<div class="row">
<label>Route Group</label>
<select id="group">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>
</select>
</div>

</div>


<!-- GEOMETRY -->

<div class="card">

<h3>Curve Geometry</h3>

<div class="row">
<label>Radius (m)</label>
<input id="radius">
</div>

<div class="row">
<label>Degree</label>
<input id="degree">
</div>

<div class="row">
<label>Chord (m)</label>
<input id="chord" value="20">
</div>

<div class="row">
<label>Versine (mm)</label>
<input id="versine">
</div>

<div id="geometry_error" class="error"></div>

</div>


<!-- SPEED -->

<div class="card">

<h3>Speed Inputs</h3>

<div class="row">
<label>Vmax</label>
<input id="vmax">
</div>

<div class="row">
<label>Vmin</label>
<input id="vmin">
</div>

</div>


<!-- CANT -->

<div class="card">

<h3>Cant Design</h3>

<div class="row">
<label>Eq Cant Vmax</label>
<input id="cant_vmax" readonly>
</div>

<div class="row">
<label>Eq Cant Vmin</label>
<input id="cant_vmin" readonly>
</div>

<div class="row">
<label>Max Cant</label>
<input id="cant_max" readonly>
</div>

<div class="row">
<label>Cant Provided</label>
<input id="cant_provided">
</div>

<div class="row">
<label>Cant Deficiency</label>
<input id="cant_def" readonly>
</div>

<div id="cant_warning" class="warning"></div>

</div>


<!-- SPEED RESULT -->

<div class="card">

<h3>Speed Result</h3>

<div class="row">
<label>Max Speed</label>
<input id="speed" readonly>
</div>

</div>


<!-- STEPS -->

<div class="card">

<h3>Calculation Steps</h3>

<div id="steps" class="steps"></div>

</div>


<!-- CURVE GRAPH -->

<div class="card">

<h3>Curve Diagram</h3>

<canvas id="curveChart"></canvas>

</div>


<!-- CANT GRAPH -->

<div class="card">

<h3>Cant Diagram</h3>

<canvas id="cantChart"></canvas>

</div>


</div>


<script>

const inputs=["radius","degree","versine","vmax","vmin","cant_provided"]

inputs.forEach(id=>{
document.getElementById(id).addEventListener("input",calculate)
})


function calculate(){

let R=parseFloat(radius.value)
let V=parseFloat(versine.value)
let C=parseFloat(chord.value)
let vmax_val=parseFloat(vmax.value)
let vmin_val=parseFloat(vmin.value)

let G=parseFloat(gauge.value)
let group_val=group.value

let steps_txt=""

geometry_error.innerHTML=""
cant_warning.innerHTML=""


/* radius from versine */

if(!R && V){

R=(125*C*C)/V
radius.value=R.toFixed(2)

steps_txt+=`
R = 125 C² / V
R = 125 × ${C}² / ${V}
R = ${R.toFixed(2)} m
`

}


/* versine */

if(R && !V){

V=(125*C*C)/R
versine.value=V.toFixed(2)

steps_txt+=`

V = 125 C² / R
V = ${V.toFixed(2)} mm
`

}


/* degree */

if(R){

let D=1750/R
degree.value=D.toFixed(3)

}


/* cant */

if(R && vmax_val){

let cant1=(vmax_val*vmax_val*G)/(127*R)

cant_vmax.value=cant1.toFixed(2)

steps_txt+=`

C = V²G / 127R
C = (${vmax_val}² × ${G}) / (127 × ${R})
C = ${cant1.toFixed(2)} mm
`

}


if(R && vmin_val){

let cant2=(vmin_val*vmin_val*G)/(127*R)
cant_vmin.value=cant2.toFixed(2)

}


/* max cant */

let maxcant=(group_val=="A"||group_val=="B")?185:165
cant_max.value=maxcant


/* cant deficiency */

let provided=parseFloat(cant_provided.value)

if(provided){

let deficiency=cant_vmax.value-provided
cant_def.value=deficiency.toFixed(2)

if(deficiency>100){

cant_warning.innerHTML="Cant deficiency exceeds 100 mm"

}

}


/* speed */

if(R && provided){

let sp=Math.sqrt((provided+100)*R*0.27)
speed.value=sp.toFixed(2)

}


steps.innerText=steps_txt

drawCurve()
drawCant()

}


/* curve diagram */

function drawCurve(){

let canvas=document.getElementById("curveChart")
let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.beginPath()

ctx.moveTo(10,150)
ctx.lineTo(120,150)
ctx.quadraticCurveTo(220,20,340,150)
ctx.lineTo(460,150)

ctx.stroke()

}


/* cant graph */

function drawCant(){

let canvas=document.getElementById("cantChart")
let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.beginPath()

ctx.moveTo(10,170)
ctx.lineTo(200,40)
ctx.lineTo(400,40)
ctx.lineTo(580,170)

ctx.stroke()

}

</script>

</body>

</html>
